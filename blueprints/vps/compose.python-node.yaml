name: __APP_SLUG__

services:
  backend:
    image: ghcr.io/kanedasec/__APP_SLUG__-backend:${IMAGE_TAG:?IMAGE_TAG must be set}
    env_file:
      - /opt/infra/__APP_SLUG__/app.env
    expose:
      - "__BACKEND_PORT__"
    healthcheck:
      # Adapt to a command available inside the backend image.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:__BACKEND_PORT____READINESS_PATH__', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    init: true
    networks:
      - application
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: ghcr.io/kanedasec/__APP_SLUG__-frontend:${IMAGE_TAG:?IMAGE_TAG must be set}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "__FRONTEND_PORT__"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:__FRONTEND_PORT__/health
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    init: true
    networks:
      application:
      proxy:
        aliases:
          - __APP_SLUG__-frontend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  application:
    internal: true

  proxy:
    external: true
    name: proxy
