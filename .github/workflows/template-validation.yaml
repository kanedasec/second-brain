name: Template validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Template validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          bin_dir="$RUNNER_TEMP/bin"
          mkdir -p "$bin_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" actionlint
          chmod 0755 "$bin_dir/actionlint"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Validate workflow blueprints
        shell: bash
        run: actionlint blueprints/github/*.yaml

      - name: Validate template security invariants
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/validate_template.py

      - name: Scan changed content for secrets
        if: github.event_name == 'pull_request'
        uses: kanedasec/platform-workflows/actions/gitleaks-scan@d2f64a7d70a3112c7a99687e60963be804306a31
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          report_path: ${{ runner.temp }}/gitleaks.json

      - name: Reject detected secrets
        if: github.event_name == 'pull_request'
        env:
          REPORT_PATH: ${{ runner.temp }}/gitleaks.json
        run: |
          findings="$(jq 'length' "$REPORT_PATH")"
          if (( findings > 0 )); then
            echo "Gitleaks detected $findings finding(s)."
            jq --raw-output '.[] | "- \(.RuleID) in \(.File):\(.StartLine)"' "$REPORT_PATH"
            exit 1
          fi
