name: CI and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: second-brain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard-ci:
    name: Standard CI
    permissions:
      contents: read
    uses: kanedasec/platform-workflows/.github/workflows/ci-python-node.yaml@2358c3996ce347e42ee8dfd09e2cba68a74a30bf
    with:
      python_enabled: true
      python_version: "3.13"
      python_working_directory: .
      python_requirements_file: requirements-dev.txt
      python_cache_dependency_path: |
        requirements.txt
        requirements-dev.txt
      python_test_path: tests
      node_enabled: false

  containers:
    name: Application container
    if: github.event_name != 'pull_request'
    needs: standard-ci
    permissions:
      contents: read
      packages: write
    uses: kanedasec/platform-workflows/.github/workflows/container-publish.yaml@2358c3996ce347e42ee8dfd09e2cba68a74a30bf
    with:
      images: >-
        [
          {"name":"app","context":".","dockerfile":"./Dockerfile"}
        ]

  deploy:
    name: Development deployment
    if: github.event_name != 'pull_request'
    needs: containers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: development
    permissions:
      contents: read
    steps:
      - name: Deploy immutable application image
        uses: kanedasec/platform-workflows/actions/tailscale-ssh-deploy@2358c3996ce347e42ee8dfd09e2cba68a74a30bf
        with:
          oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
          ssh_private_key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          target_host: ${{ vars.DEPLOY_HOST }}
          target_user: ${{ vars.DEPLOY_USER }}
          known_hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          deploy_command: ${{ vars.DEPLOY_COMMAND }}
          image_tag: sha-${{ github.sha }}
          public_url: ${{ vars.DEPLOY_URL }}
          root_expected_status: "401"
          readiness_path: /ready
